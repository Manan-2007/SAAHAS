<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="light dark" />
    <!-- Light or dark before first paint: the session's choice, else the phone's (see src/theme.tsx). -->
    <script>
      (function () {
        var pref = null;
        try { pref = sessionStorage.getItem('sahaas_theme'); } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f2ea');
      })();
    </script>
    <!-- Kept short and plain: the tab title is visible to anyone who picks up a shared phone. -->
    <title>SAAHAS</title>
    <meta name="description" content="A private, trauma-informed space to check in, talk, and find support." />
    <meta property="og:title" content="SAAHAS" />
    <meta property="og:description" content="A private, trauma-informed space to check in, talk, and find support." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Plus Jakarta Sans for the interface, Fraunces for the occasional emotional line,
         Noto for हिन्दी and ਪੰਜਾਬੀ (Google serves those only when the script is on screen).
         Inter + Material Symbols are used by the counsellor Command Centre. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
